<!DOCTYPE html>
<html lang="en">
<head>
    <title>Kofin Sync Queue</title>
</head>
<body>
<div id="kofinSyncQueueConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
    <div data-role="content">
        <div class="content-primary">
            <form id="kofinSyncQueueConfigForm">
                <div class="verticalSection verticalSection-extrabottompadding">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">Kofin Sync Queue</h2>
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" type="number" id="txtRetentionDays" pattern="[0-9]*" required min="0" max="3650" label="Retention (days)" />
                        <div class="fieldDescription">
                            How many days of change records to keep. 0 keeps them forever;
                            the default of 90 keeps the queue bounded. Clients detect when
                            their last sync predates the window and heal automatically.
                        </div>
                    </div>
                    <br />
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            var pluginId = "eed3be84-d5cc-4f3b-b346-ba80c81cbec9";

            document.querySelector('#kofinSyncQueueConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        document.querySelector('#txtRetentionDays').value = config.RetentionDays;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#kofinSyncQueueConfigForm')
                .addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.RetentionDays = parseInt(document.querySelector('#txtRetentionDays').value, 10) || 0;
                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });
        })();
    </script>
</div>
</body>
</html>
